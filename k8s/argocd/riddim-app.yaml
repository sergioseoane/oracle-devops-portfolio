apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riddim
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/sergio/riddim-deploy.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: riddim
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
