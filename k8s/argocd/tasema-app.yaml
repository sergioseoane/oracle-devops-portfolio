apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasema
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/sergio/tasema.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
